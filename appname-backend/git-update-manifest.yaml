# Backend / Frontend で共用する AppName 用 GitOps 更新 Task
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-update-manifest
  labels:
    app.kubernetes.io/part-of: appname-cicd
spec:
  description: |
    AppName GitOps Repository の環境別 kustomization.yaml で、
    対象 Application Image の newTag を Commit SHA に更新して push する。
  params:
    - name: GIT_REPOSITORY
      type: string
      description: GitOps Repository の URL
    - name: APP_NAME
      type: string
      description: backend または frontend
    - name: IMAGE_TAG
      type: string
      description: 新しいイメージタグ（通常は Commit SHA）
    - name: KUSTOMIZATION_PATH
      type: string
      default: overlays/dev
      description: 更新対象の kustomization.yaml が配置された環境別パス
    - name: GIT_CREDENTIALS_SECRET
      type: string
      default: github-credentials
      description: GitHub push 用 Secret
  workspaces:
    - name: source
  steps:
    - name: git-clone
      image: registry.redhat.io/openshift-pipelines/pipelines-git-init-rhel9@sha256:cfdb7edab602f2b476c0cc7b39cdad6f204bb7e991a6a9f27e1e5174b348fda5
      workingDir: $(workspaces.source.path)
      env:
        - name: GIT_USERNAME
          valueFrom:
            secretKeyRef:
              name: $(params.GIT_CREDENTIALS_SECRET)
              key: username
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.GIT_CREDENTIALS_SECRET)
              key: token
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        MANIFEST_DIR="$(workspaces.source.path)/manifest"
        AUTH_REPOSITORY="$(params.GIT_REPOSITORY)"
        AUTH_REPOSITORY="${AUTH_REPOSITORY/https:\/\//https://${GIT_USERNAME}:${GIT_TOKEN}@}"

        echo "Cloning manifest repository: $(params.GIT_REPOSITORY)"
        rm -rf "${MANIFEST_DIR}"
        git clone "${AUTH_REPOSITORY}" "${MANIFEST_DIR}"
        git -C "${MANIFEST_DIR}" config user.email "pipeline@openshift.local"
        git -C "${MANIFEST_DIR}" config user.name "Tekton Pipeline"
        git -C "${MANIFEST_DIR}" remote set-url origin "${AUTH_REPOSITORY}"

        echo "Manifest repository clone completed"
    - name: update-image-tag
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        MANIFEST_DIR="$(workspaces.source.path)/manifest"
        KUSTOMIZATION_FILE="${MANIFEST_DIR}/$(params.KUSTOMIZATION_PATH)/kustomization.yaml"
        IMAGE_TAG="$(params.IMAGE_TAG)"

        case "$(params.APP_NAME)" in
          backend)
            IMAGE_NAME="appname-backend"
            ;;
          frontend)
            IMAGE_NAME="appname-frontend"
            ;;
          *)
            echo "ERROR: APP_NAME は backend または frontend を指定してください: $(params.APP_NAME)" >&2
            exit 1
            ;;
        esac

        get_image_tag() {
          local target_image="$1"
          local source_file="$2"

          awk -v target="${target_image}" -v source_file="${source_file}" '
            function indentation(line, spaces) {
              spaces = line
              sub(/[^ ].*$/, "", spaces)
              return length(spaces)
            }

            function scalar(value) {
              sub(/[[:space:]]+#.*$/, "", value)
              gsub(/^[[:space:]]+/, "", value)
              gsub(/[[:space:]]+$/, "", value)
              if (value ~ /^".*"$/) {
                value = substr(value, 2, length(value) - 2)
              }
              return value
            }

            /^[[:space:]]*images:[[:space:]]*(#.*)?$/ {
              images_sections++
              in_images = 1
              images_indent = indentation($0)
              next
            }

            in_images && $0 !~ /^[[:space:]]*(#.*)?$/ && indentation($0) <= images_indent {
              in_images = 0
              in_target = 0
            }

            in_images && /^[[:space:]]*-[[:space:]]*name:[[:space:]]*/ {
              image_name = $0
              sub(/^[[:space:]]*-[[:space:]]*name:[[:space:]]*/, "", image_name)
              in_target = (scalar(image_name) == target)
              if (in_target) {
                target_count++
                target_indent = indentation($0)
              }
              next
            }

            in_target && $0 !~ /^[[:space:]]*(#.*)?$/ && indentation($0) <= target_indent {
              in_target = 0
            }

            in_target && /^[[:space:]]*newTag:[[:space:]]*/ {
              tag_value = $0
              sub(/^[[:space:]]*newTag:[[:space:]]*/, "", tag_value)
              old_tag = scalar(tag_value)
              tag_count++
            }

            END {
              if (images_sections == 0) {
                printf "ERROR: images定義がkustomization.yamlに見つかりません: %s\n", source_file > "/dev/stderr"
                exit 1
              }
              if (target_count == 0) {
                printf "ERROR: 対象Imageがimages定義に見つかりません: %s\n", target > "/dev/stderr"
                exit 1
              }
              if (target_count > 1) {
                printf "ERROR: 対象Imageがimages定義に複数存在します: %s\n", target > "/dev/stderr"
                exit 1
              }
              if (tag_count != 1) {
                printf "ERROR: 対象ImageのnewTagを一意に特定できません: %s\n", target > "/dev/stderr"
                exit 1
              }
              print old_tag
            }
          ' "${source_file}"
        }

        echo "Checking kustomization file: ${KUSTOMIZATION_FILE}"

        if [[ ! -f "${KUSTOMIZATION_FILE}" ]]; then
          echo "ERROR: kustomization.yaml が見つかりません: ${KUSTOMIZATION_FILE}" >&2
          exit 1
        fi

        echo "Target image: ${IMAGE_NAME}"

        if ! OLD_TAG="$(get_image_tag "${IMAGE_NAME}" "${KUSTOMIZATION_FILE}")"; then
          exit 1
        fi

        echo "Current newTag: ${OLD_TAG}"
        echo "Requested newTag: ${IMAGE_TAG}"

        if [[ "${OLD_TAG}" == "${IMAGE_TAG}" ]]; then
          echo "No image tag change required for ${IMAGE_NAME}"
          exit 0
        fi

        BEFORE_CHECKSUM="$(sha256sum "${KUSTOMIZATION_FILE}" | awk '{print $1}')"
        UPDATED_FILE="/tmp/kustomization.yaml"

        if ! awk -v target="${IMAGE_NAME}" -v new_tag="${IMAGE_TAG}" '
          function indentation(line, spaces) {
            spaces = line
            sub(/[^ ].*$/, "", spaces)
            return length(spaces)
          }

          function scalar(value) {
            sub(/[[:space:]]+#.*$/, "", value)
            gsub(/^[[:space:]]+/, "", value)
            gsub(/[[:space:]]+$/, "", value)
            if (value ~ /^".*"$/) {
              value = substr(value, 2, length(value) - 2)
            }
            return value
          }

          {
            line = $0

            if (line ~ /^[[:space:]]*images:[[:space:]]*(#.*)?$/) {
              images_sections++
              in_images = 1
              images_indent = indentation(line)
              print line
              next
            }

            if (in_images && line !~ /^[[:space:]]*(#.*)?$/ && indentation(line) <= images_indent) {
              in_images = 0
              in_target = 0
            }

            if (in_images && line ~ /^[[:space:]]*-[[:space:]]*name:[[:space:]]*/) {
              image_name = line
              sub(/^[[:space:]]*-[[:space:]]*name:[[:space:]]*/, "", image_name)
              in_target = (scalar(image_name) == target)
              if (in_target) {
                target_count++
                target_indent = indentation(line)
              }
              print line
              next
            }

            if (in_target && line !~ /^[[:space:]]*(#.*)?$/ && indentation(line) <= target_indent) {
              in_target = 0
            }

            if (in_target && line ~ /^[[:space:]]*newTag:[[:space:]]*/) {
              match(line, /^[[:space:]]*newTag:[[:space:]]*/)
              prefix = substr(line, 1, RLENGTH)
              remainder = substr(line, RLENGTH + 1)
              comment = ""
              if (match(remainder, /[[:space:]]+#/)) {
                comment = substr(remainder, RSTART)
              }
              print prefix "\"" new_tag "\"" comment
              updated_count++
              next
            }

            print line
          }

          END {
            if (images_sections == 0) {
              print "ERROR: images定義がkustomization.yamlに見つかりません" > "/dev/stderr"
              exit 1
            }
            if (target_count == 0) {
              printf "ERROR: 対象Imageがimages定義に見つかりません: %s\n", target > "/dev/stderr"
              exit 1
            }
            if (target_count > 1 || updated_count != 1) {
              printf "ERROR: 対象ImageのnewTagを一意に更新できません: %s\n", target > "/dev/stderr"
              exit 1
            }
          }
        ' "${KUSTOMIZATION_FILE}" > "${UPDATED_FILE}"; then
          echo "ERROR: kustomization.yaml のImage Tag更新に失敗しました: ${IMAGE_NAME}" >&2
          exit 1
        fi

        AFTER_CHECKSUM="$(sha256sum "${UPDATED_FILE}" | awk '{print $1}')"
        if [[ "${BEFORE_CHECKSUM}" == "${AFTER_CHECKSUM}" ]]; then
          echo "ERROR: newTag更新後にkustomization.yamlの変更を確認できません: ${IMAGE_NAME}" >&2
          exit 1
        fi

        cp "${UPDATED_FILE}" "${KUSTOMIZATION_FILE}"

        if ! UPDATED_TAG="$(get_image_tag "${IMAGE_NAME}" "${KUSTOMIZATION_FILE}")"; then
          exit 1
        fi

        if [[ "${UPDATED_TAG}" != "${IMAGE_TAG}" ]]; then
          echo "ERROR: newTag更新後の値が期待値と一致しません: expected=${IMAGE_TAG}, actual=${UPDATED_TAG}" >&2
          exit 1
        fi

        echo "Updated newTag: ${UPDATED_TAG}"
        echo "Image tag update completed for ${IMAGE_NAME}"
    - name: git-push
      image: registry.redhat.io/openshift-pipelines/pipelines-git-init-rhel9@sha256:cfdb7edab602f2b476c0cc7b39cdad6f204bb7e991a6a9f27e1e5174b348fda5
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        MANIFEST_DIR="$(workspaces.source.path)/manifest"
        KUSTOMIZATION_FILE="$(params.KUSTOMIZATION_PATH)/kustomization.yaml"

        echo "Checking Git diff for: ${KUSTOMIZATION_FILE}"
        if git -C "${MANIFEST_DIR}" diff --quiet -- "${KUSTOMIZATION_FILE}"; then
          echo "No Git diff detected; commit and push are not required"
          exit 0
        fi

        git -C "${MANIFEST_DIR}" diff --stat -- "${KUSTOMIZATION_FILE}"

        echo "Starting commit for $(params.APP_NAME): $(params.IMAGE_TAG)"
        git -C "${MANIFEST_DIR}" add "${KUSTOMIZATION_FILE}"
        git -C "${MANIFEST_DIR}" commit -m "ci($(params.APP_NAME)): update image tag to $(params.IMAGE_TAG)"

        echo "Commit completed"
        echo "Starting push to main branch"
        git -C "${MANIFEST_DIR}" push origin HEAD:main

        echo "Push to main branch completed"
